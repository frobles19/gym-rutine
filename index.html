<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0e1013">
<title>Gym</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--tx:#14171c;--mut:#6b7280;--bd:#e5e7eb;--inp:#f1f3f5;--shadow:0 1px 3px rgba(0,0,0,.08);
  --blue:#2563eb;--green:#16a34a;--orange:#ea580c;--violet:#7c3aed;--gray:#64748b;--ok:#16a34a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1013;--card:#181b20;--tx:#eef0f3;--mut:#98a1ad;--bd:#272b33;--inp:#22262d;--shadow:none;
  --blue:#3b82f6;--green:#22c55e;--orange:#f97316;--violet:#8b5cf6}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:12px 10px}
h1{font-size:28px;margin:6px 4px 2px}
h2{font-size:20px;margin:18px 4px 8px}
h3{font-size:17px;margin:0}
p{margin:0}
.sub{color:var(--mut);margin:0 4px 12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
.card{background:var(--card);border-radius:16px;padding:12px;margin:0 0 12px;box-shadow:var(--shadow);border-left:6px solid var(--c,var(--gray))}
.pill{display:inline-block;font-size:12px;font-weight:700;background:var(--c);color:#fff;border-radius:99px;padding:2px 9px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.chip{min-height:56px;border-radius:14px;background:var(--card);border:2px solid var(--bd);font-weight:700;padding:6px 8px;box-shadow:var(--shadow)}
.chip small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.chip.on{background:var(--c);border-color:var(--c);color:#fff}
.chip.on small{color:#ffffffcc}
.big{display:block;width:100%;min-height:58px;border-radius:16px;background:var(--c,var(--blue));color:#fff;font-size:19px;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.btn{min-height:46px;padding:0 16px;border-radius:12px;background:var(--inp);font-weight:700}
.btn.pri{background:var(--c,var(--blue));color:#fff}
.btn.red{color:#dc2626}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.stick{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));z-index:5;margin-top:8px}
.top{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 4px 8px;margin:-12px -10px 8px;padding-left:14px;padding-right:14px}
.top .l1{display:flex;align-items:center;justify-content:space-between}
.top .t{font-size:22px;font-weight:800;color:var(--c)}
.top .clock{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:6px;margin-top:6px;align-items:center;font-size:13px;color:var(--mut)}
.seg button{min-height:36px;padding:0 14px;border-radius:99px;background:var(--card);font-weight:700;border:2px solid var(--bd)}
.seg button.on{background:var(--c);border-color:var(--c);color:#fff}
.ex+.ex{border-top:1px dashed var(--bd);margin-top:12px;padding-top:12px}
.exh{display:flex;gap:10px;align-items:flex-start}
.lab{min-width:38px;height:38px;border-radius:10px;background:var(--c);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px}
.meta{color:var(--mut);font-size:13px}
.last{font-size:13px;color:var(--mut);margin:6px 0 2px}
.hint{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:14px;font-weight:700;border-radius:10px;padding:6px 10px;margin:6px 0}
.hint.up{background:#16a34a22;color:var(--ok)}
.hint.down{background:#f59e0b26;color:#d97706}
.hint button{min-height:34px;padding:0 10px;border-radius:8px;background:var(--card);font-size:13px}
.set,.sh{display:grid;grid-template-columns:22px 1fr 1fr 46px;gap:6px;align-items:center;margin:6px 0}
.set.s1,.sh.s1{grid-template-columns:22px 1fr 46px}
.sh{margin:8px 0 0;font-size:11px;color:var(--mut);text-transform:uppercase;text-align:center}
.sn{font-weight:800;color:var(--mut);text-align:center}
.st{display:grid;grid-template-columns:38px minmax(0,1fr) 38px;background:var(--inp);border-radius:12px;height:48px;overflow:hidden}
.st button{font-size:24px;font-weight:700;color:var(--mut)}
.st input{width:100%;min-width:0;border:0;background:none;text-align:center;font:800 22px system-ui;color:var(--tx);padding:0;outline:none;font-variant-numeric:tabular-nums}
.chk{height:48px;border-radius:12px;background:var(--inp);color:var(--mut);font-size:24px;font-weight:800}
.set.done .st{background:color-mix(in srgb,var(--c) 16%,var(--card))}
.set.done .chk{background:var(--ok);color:#fff}
.setctl{display:flex;gap:8px;margin-top:4px}
.setctl button{flex:1;min-height:44px;border-radius:10px;background:var(--inp);color:var(--mut);font-weight:700;font-size:14px}
#rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:20;display:none;padding:0 10px}
#rest .in{max-width:560px;margin:0 auto;background:#14171c;color:#fff;border-radius:16px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.45);overflow:hidden;position:relative}
#rest .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--c,#3b82f6);transition:width .3s linear}
#rest .rw{display:flex;align-items:center;gap:8px}
#rest .rt{flex:1;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center}
#rest button{min-height:46px;min-width:56px;padding:0 10px;border-radius:12px;background:#ffffff22;color:#fff;font-weight:700}
#rest.fin .in{background:var(--ok);animation:pulse .6s 3}
@keyframes pulse{50%{transform:scale(1.03)}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mut);gap:2px}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--blue)}
.item{display:flex;align-items:center;gap:10px;min-height:52px;width:100%;text-align:left}
.item .nm{flex:1}
.item .rg{color:var(--mut);font-size:14px;white-space:nowrap}
.mini{width:44px;height:44px;border-radius:10px;background:var(--inp);font-size:18px}
details.card summary{list-style:none;cursor:pointer;min-height:44px;display:flex;align-items:center;gap:10px}
details.card summary::-webkit-details-marker{display:none}
.sdate{font-weight:800}
.tag{font-size:12px;font-weight:800;color:#fff;background:var(--c);border-radius:99px;padding:2px 9px}
table{border-collapse:collapse;width:100%}
td,th{padding:4px 6px;text-align:left;font-size:14px;border-bottom:1px solid var(--bd)}
.cov{margin-bottom:8px}
.cov b{display:block;margin-bottom:2px}
.cov small{color:var(--mut)}
.cov .p{color:var(--tx)}
ul.ind{padding-left:20px;margin:0}
ul.ind li{margin:8px 0}
select,input.f,textarea{width:100%;min-height:48px;border-radius:12px;border:2px solid var(--bd);background:var(--inp);color:var(--tx);font:inherit;padding:0 12px}
label.fl{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
#sheetBg{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end;justify-content:center}
#sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#14171c;color:#fff;padding:10px 16px;border-radius:99px;z-index:60;display:none;font-weight:700;max-width:90vw}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
svg text{fill:var(--mut);font-size:10px}
.pr{font-size:34px;font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<div id="rest"></div>
<nav id="nav">
  <button data-tab="train"><span>🏋️</span>Entrenar</button>
  <button data-tab="hist"><span>📈</span>Historial</button>
  <button data-tab="rut"><span>📝</span>Rutina</button>
  <button data-tab="info"><span>ℹ️</span>Info</button>
</nav>
<div id="sheetBg"><div id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept=".json,.csv,application/json,text/csv" hidden>

<script>
'use strict';
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const fmt=n=>String(Math.round(n*10)/10).replace('.',',');
const LET='ABCDEFGHIJKLMN';
const KEY='gymapp.v1';
const rid=()=>'x'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);

/* ---------- rutina precargada ---------- */
function seed(){
  const mk=(p)=>{let n=0;return (name,sets,min,max,note='',unit='r')=>({id:p+(++n),name,sets,min,max,note,unit})};
  let r=mk('ta');
  const ta=[
    [r('Press de pecho en máquina',4,8,10),r('Elevaciones laterales con mancuernas',4,12,15,'Al lado de la máquina')],
    [r('Jalón al pecho (agarre abierto)',3,10,12,'Serie simple')],
    [r('Remo sentado en polea baja (triángulo)',4,8,10,'Misma estación del jalón')],
    [r('Curl de bíceps en polea baja (barra)',3,10,12,'Polea cruzada, lado bajo'),r('Pushdown de tríceps con cuerda',3,10,12,'Polea cruzada, lado alto')],
    [r('Pájaros en pec deck invertido',3,12,15,'Serie simple')]];
  r=mk('pi');
  const pi=[
    [r('Prensa de piernas',4,8,10),r('Plancha',4,30,45,'En el piso, al lado','sec')],
    [r('Gemelos en máquina',3,12,15),r('Elevaciones de piernas acostado',3,12,15,'En el piso, al lado')],
    [r('Curl femoral acostado',3,10,12,'Serie simple')],
    [r('Extensión de cuádriceps',3,10,12,'Serie simple')],
    [r('Aductores + abductores',3,12,15,'12–15 c/u')],
    [r('Peso muerto rumano con mancuernas',3,10,10,'3 reps en reserva; sacarlo si carga mucho para el domingo')]];
  r=mk('br');
  const br=[
    [r('Curl con barra Z',4,8,10),r('Press francés con barra Z',4,8,10,'Misma barra, banco plano')],
    [r('Curl en polea baja de espaldas (unilateral)',3,10,12,'Polea cruzada, lado bajo'),r('Extensión de tríceps sobre la cabeza con cuerda',3,10,12,'Polea cruzada, lado alto')],
    [r('Curl martillo con cuerda',3,12,15,'Misma polea'),r('Pushdown unilateral',3,12,15,'Misma polea')],
    [r('Elevaciones laterales unilaterales en polea',4,12,15,'Misma polea, lado bajo'),r('Pájaros en polea cruzada',3,15,15,'Cables cruzados a la altura del hombro')]];
  r=mk('tb');
  const tb=[
    [r('Press inclinado en máquina',4,8,10),r('Elevaciones laterales con mancuernas',3,12,15,'Al lado de la máquina')],
    [r('Jalón con agarre neutro (cerrado)',4,8,10,'Serie simple')],
    [r('Remo con pecho apoyado en máquina',3,10,12,'Serie simple')],
    [r('Aperturas en pec deck',3,12,15),r('Pájaros en pec deck (invertido)',3,12,15,'Misma máquina, cambiar posición')],
    [r('Curl predicador en máquina',3,10,12),r('Extensión de tríceps con mancuerna sobre la cabeza',3,10,12,'Sentado, al lado de la máquina')]];
  return {days:[
    {id:'torsoA',name:'Torso A',dayName:'Lunes',color:'blue',blocks:ta},
    {id:'piernas',name:'Piernas + Core',dayName:'Martes',color:'green',blocks:pi},
    {id:'brazos',name:'Brazos + Hombros',dayName:'Miércoles',color:'orange',blocks:br},
    {id:'torsoB',name:'Torso B',dayName:'Viernes o sábado',color:'violet',blocks:tb}]};
}

/* ---------- estado ---------- */
let S=load();
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.routine&&j.sessions)return Object.assign({active:null,settings:{rest:90}},j)}catch(e){}
  return {v:1,routine:seed(),sessions:[],active:null,settings:{rest:90}};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ No se pudo guardar')}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

let tab=S.active?'train':'train', selDay=null, hv='list', progEx=null, rest=null, wake=null, audio=null;
const dayById=id=>S.routine.days.find(d=>d.id===id);
const col=d=>`var(--${d?d.color:'gray'})`;
function findEx(id){
  for(const day of S.routine.days)for(let bi=0;bi<day.blocks.length;bi++){const k=day.blocks[bi].findIndex(x=>x.id===id);if(k>=0)return {ex:day.blocks[bi][k],day,block:day.blocks[bi],bi,k}}
  return null;
}
const rng=(ex)=>(ex.min===ex.max?`${ex.min}`:`${ex.min}–${ex.max}`)+(ex.unit==='sec'?' s':'');
const lab=(block,bi,k)=>LET[bi]+(block.length>1?k+1:'');
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2200)}
const fmtDur=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`};
const fdate=t=>new Date(t).toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});

/* ---------- historial / progresión ---------- */
function lastPerf(id){
  for(const s of S.sessions){const it=s.items.find(i=>i.id===id);if(it){const ds=it.sets.filter(x=>x.d);if(ds.length)return {sets:ds,item:it,date:s.start}}}
  return null;
}
function lastText(L,ex){
  if(!L)return 'Primera vez 🆕';
  if(ex.unit==='sec')return 'La última vez: '+L.sets.map(s=>s.r).join(', ')+' s';
  const same=L.sets.every(s=>s.w===L.sets[0].w);
  return 'La última vez: '+(same?`${fmt(L.sets[0].w)} kg × ${L.sets.map(s=>s.r).join(', ')}`:L.sets.map(s=>`${fmt(s.w)}×${s.r}`).join(', '));
}
const r25=x=>Math.round(x/2.5)*2.5;
function hintFor(ex,L){
  if(!L)return null;
  const ds=L.sets;
  if(ds.length>=ex.sets&&ds.every(s=>s.r>=ex.max))return ex.unit==='sec'?{t:'up',txt:'💪 Subí el tiempo'}:{t:'up',txt:'💪 Subí el peso',w:Math.max(...ds.map(s=>s.w))+2.5};
  if(ds.some(s=>s.r<ex.min)){
    if(ex.unit==='sec')return {t:'down',txt:'Por debajo del mínimo: bajá la exigencia'};
    const m=Math.max(...ds.map(s=>s.w));
    if(m<=0)return null;
    return {t:'down',txt:`Bajá 5–10%: ${fmt(r25(m*.9))}–${fmt(r25(m*.95))} kg`,w:r25(m*.95)};
  }
  return null;
}

/* ---------- entrenamiento ---------- */
function mkSets(ex){
  const L=lastPerf(ex.id),out=[];
  for(let i=0;i<ex.sets;i++){const s=L&&(L.sets[i]||L.sets[L.sets.length-1]);out.push({w:s?s.w:0,r:s?s.r:ex.min,d:false})}
  return out;
}
function startWorkout(dayId){
  const day=dayById(dayId),sets={};
  day.blocks.flat().forEach(ex=>sets[ex.id]=mkSets(ex));
  S.active={id:rid(),dayId,start:Date.now(),sets};
  save();render();wakeLock();
}
function sessSet(exId,i){return S.active&&S.active.sets[exId]&&S.active.sets[exId][i]}
function finishWorkout(){
  const A=S.active,day=dayById(A.dayId);
  const items=day.blocks.flat().map(ex=>({id:ex.id,name:ex.name,unit:ex.unit,min:ex.min,max:ex.max,sets:(A.sets[ex.id]||[]).map(s=>({w:s.w,r:s.r,d:s.d}))})).filter(it=>it.sets.some(s=>s.d));
  if(!items.length){if(!confirm('No marcaste ninguna serie. ¿Descartar el entrenamiento?'))return;discard(true);return}
  if(!confirm('¿Terminar y guardar el entrenamiento?'))return;
  const end=Date.now();
  S.sessions.push({id:A.id,dayId:A.dayId,dayName:day.name,color:day.color,start:A.start,end,dur:end-A.start,items});
  S.sessions.sort((a,b)=>b.start-a.start);
  S.active=null;rest=null;hideRest();save();releaseWake();tab='hist';hv='list';render();toast('✅ Entrenamiento guardado');
}
function discard(skipAsk){
  if(!skipAsk&&!confirm('¿Descartar este entrenamiento? Se pierden las series cargadas.'))return;
  S.active=null;rest=null;hideRest();save();releaseWake();render();
}

/* ---------- temporizador ---------- */
function beep(){
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended')audio.resume();
    [0,.25,.5].forEach((t,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=i==2?1100:880;o.connect(g);g.connect(audio.destination);
      const n=audio.currentTime+t;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.5,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.2);o.start(n);o.stop(n+.22)});
  }catch(e){}
}
function startRest(){
  const total=S.settings.rest*1000;
  rest={end:Date.now()+total,total,fin:false};
  const day=S.active&&dayById(S.active.dayId);
  const el=$('#rest');el.className='';el.style.setProperty('--c',col(day));
  el.innerHTML=`<div class="in"><div class="rw"><button data-act="radd" data-d="-15">−15</button><div class="rt" id="rt"></div><button data-act="radd" data-d="15">+15</button><button data-act="rskip">Saltar</button></div><div class="bar" id="rbar"></div></div>`;
  el.style.display='block';tick();
}
function hideRest(){rest=null;const el=$('#rest');el.style.display='none';el.innerHTML=''}
function tick(){
  if(S.active){const c=$('#clock');if(c)c.textContent=fmtDur(Date.now()-S.active.start)}
  if(!rest)return;
  const left=rest.end-Date.now();
  if(left<=0&&!rest.fin){
    rest.fin=true;rest.finAt=Date.now();
    $('#rest').className='fin';$('#rt').textContent='¡A trabajar!';$('#rbar').style.width='0';
    try{navigator.vibrate&&navigator.vibrate([300,120,300,120,500])}catch(e){}
    beep();return;
  }
  if(rest.fin){if(Date.now()-rest.finAt>8000)hideRest();return}
  const s=Math.ceil(left/1000);
  $('#rt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  $('#rbar').style.width=(left/rest.total*100)+'%';
}
setInterval(tick,250);
document.addEventListener('visibilitychange',()=>{tick();if(!document.hidden&&S.active)wakeLock()});
async function wakeLock(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}}catch(e){}}
function releaseWake(){try{wake&&wake.release()}catch(e){}wake=null}

/* ---------- vistas ---------- */
function suggest(){
  const d=new Date().getDay(),m={1:'torsoA',2:'piernas',3:'brazos',5:'torsoB',6:'torsoB'};
  if(m[d]&&dayById(m[d]))return {id:m[d],ok:true};
  let best=S.routine.days[0].id,bt=Infinity;
  for(const day of S.routine.days){const s=S.sessions.find(x=>x.dayId===day.id),t=s?s.start:0;if(t<bt){bt=t;best=day.id}}
  return {id:best,ok:false,d};
}
function ago(dayId){
  const s=S.sessions.find(x=>x.dayId===dayId);if(!s)return 'sin registros';
  const n=Math.floor((Date.now()-s.start)/864e5);return n<=0?'hoy':n===1?'ayer':`hace ${n} días`;
}
function vTrain(){return S.active?vWork():vHome()}
function vHome(){
  const sg=suggest();if(!selDay||!dayById(selDay))selDay=sg.id;
  const msg=sg.ok?'Hoy toca 💪':(sg.d===0?'Domingo de torneo ⚽. Si querés entrenar, sugiero:':'Hoy no toca. Si querés entrenar, sugiero:');
  const day=dayById(selDay);
  return `<h1>Entrenar</h1><p class="sub">${msg}</p>
  <div class="chips">${S.routine.days.map(d=>`<button class="chip ${d.id===selDay?'on':''}" style="--c:${col(d)}" data-act="pick" data-id="${d.id}">${esc(d.name)}<small>${esc(d.dayName)} · ${ago(d.id)}</small></button>`).join('')}</div>

function vSessions(){
  if(!S.sessions.length)return '<div class="empty">Todavía no hay entrenamientos guardados.</div>';
  return S.sessions.map(s=>{
    const vol=s.items.reduce((a,it)=>a+it.sets.reduce((b,x)=>b+(x.d&&it.unit!=='sec'?x.w*x.r:0),0),0);

}
function bestOf(it){const ds=it.sets.filter(x=>x.d);if(!ds.length)return null;return it.unit==='sec'?Math.max(...ds.map(x=>x.r)):Math.max(...ds.map(x=>x.w))}
function vProg(){
  const map={};
  [...S.sessions].reverse().forEach(s=>s.items.forEach(it=>{if(bestOf(it)!==null)map[it.id]=it.name}));
  const ids=Object.keys(map).sort((a,b)=>map[a].localeCompare(map[b],'es'));
  if(!ids.length)return '<div class="empty">Guardá un entrenamiento para ver tu progreso.</div>';
  if(!progEx||!map[progEx])progEx=ids[0];
  const pts=[];let unit='r';
  [...S.sessions].reverse().forEach(s=>{const it=s.items.find(i=>i.id===progEx);if(it){const b=bestOf(it);if(b!==null){unit=it.unit;pts.push({x:s.start,y:b})}}});
  const pr=Math.max(...pts.map(p=>p.y)),u=unit==='sec'?' s':' kg';
  return `<select data-act="progsel">${ids.map(i=>`<option value="${i}" ${i===progEx?'selected':''}>${esc(map[i])}</option>`).join('')}</select>
  <div class="card" style="margin-top:12px;--c:var(--blue)"><div class="meta">Récord personal</div><div class="pr">🏆 ${fmt(pr)}${u}</div></div>
  <div class="card" style="--c:var(--blue)"><div class="meta">Mejor ${unit==='sec'?'tiempo':'peso'} por sesión</div>${chart(pts,u)}</div>
  <div class="card" style="--c:var(--blue)"><table>${[...pts].reverse().map(p=>`<tr><td>${esc(fdate(p.x))}</td><td><b>${fmt(p.y)}${u}</b></td></tr>`).join('')}</table></div>`;
}
function chart(pts,u){
  const W=320,H=190,pl=34,pr=10,pt=14,pb=26;
  const ys=pts.map(p=>p.y);let lo=Math.min(...ys),hi=Math.max(...ys);
  if(lo===hi){lo-=2;hi+=2}else{const p=(hi-lo)*.2;lo-=p;hi+=p}
  const X=i=>pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1));
  const Y=y=>pt+(hi-y)/(hi-lo)*(H-pt-pb);
  const grid=[0,.5,1].map(f=>{const y=lo+(hi-lo)*f;return `<line x1="${pl}" x2="${W-pr}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--bd)"/><text x="${pl-4}" y="${Y(y)+3}" text-anchor="end">${fmt(y)}</text>`}).join('');
  const line=pts.map((p,i)=>`${X(i)},${Y(p.y)}`).join(' ');
  const best=Math.max(...ys);
  const dots=pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="${p.y===best?5:3.5}" fill="${p.y===best?'var(--orange)':'var(--blue)'}"/>`).join('');
  const d=t=>new Date(t).toLocaleDateString('es-AR',{day:'numeric',month:'short'});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="gráfico de progreso">${grid}<polyline points="${line}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text x="${pl}" y="${H-8}">${d(pts[0].x)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end">${pts.length>1?d(pts[pts.length-1].x):''}</text></svg>`;
}

function download(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);

const stamp=()=>new Date().toISOString().slice(0,10);
function toCSV(){
  const q=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[['sesion_id','fecha','dia','duracion_min','ejercicio_id','ejercicio','unidad','serie','peso_kg','reps_o_seg']];
  S.sessions.forEach(s=>s.items.forEach(it=>it.sets.forEach((x,i)=>{if(x.d)rows.push([s.id,new Date(s.start).toISOString(),s.dayName,Math.round(s.dur/60000),it.id,it.name,it.unit,i+1,x.w,x.r])})));
  return rows.map(r=>r.map(q).join(',')).join('\n');
}
function parseCSV(t){
  const rows=[];let row=[],f='',inq=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(inq){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else inq=false}else f+=c}
    else if(c==='"')inq=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.length>1);
}
function importCSV(t){
  const rows=parseCSV(t.replace(/^﻿/,''));rows.shift();
  const by={};
  rows.forEach(r=>{const [sid,fecha,dia,dur,eid,en,unit,serie,w,rp]=r;(by[sid]=by[sid]||{id:sid,fecha,dia,dur:num(dur),items:{}});
    const it=(by[sid].items[eid]=by[sid].items[eid]||{id:eid,name:en,unit:unit||'r',min:0,max:0,sets:[]});it.sets.push({w:num(w),r:num(rp),d:true})});
  let n=0;
  Object.values(by).forEach(b=>{
    if(S.sessions.some(s=>s.id===b.id))return;
    const day=S.routine.days.find(d=>d.name===b.dia),start=Date.parse(b.fecha)||Date.now();
    S.sessions.push({id:b.id,dayId:day?day.id:'',dayName:b.dia,color:day?day.color:'gray',start,end:start+b.dur*6e4,dur:b.dur*6e4,items:Object.values(b.items)});n++});
  S.sessions.sort((a,b)=>b.start-a.start);save();render();toast(`Importadas ${n} sesiones`);
}

    const {ex,i,f,d}=t.dataset,inp=document.getElementById(`n-${ex}-${i}-${f}`),e=findEx(ex);
    const step=f==='w'?2.5:(e&&e.ex.unit==='sec'?5:1);

  },

    const {ex,i}=t.dataset,s=sessSet(ex,+i);if(!s)return;

    if(!s.d)return;
    try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}
    const f=findEx(ex);if(!f)return;
    const ok=f.block.every(e=>{const arr=S.active.sets[e.id];return !arr||!arr[+i]||arr[+i].d});
    if(ok)startRest();
  },
  addset:t=>{const a=S.active.sets[t.dataset.ex],l=a[a.length-1]||{w:0,r:0};a.push({w:l.w,r:l.r,d:false});save();render()},
  delset:t=>{const a=S.active.sets[t.dataset.ex];if(a.length>1){a.pop();save();render()}},
  applyw:t=>{const w=+t.dataset.w;S.active.sets[t.dataset.ex].forEach(s=>{if(!s.d)s.w=w});save();render()},
  radd:t=>{if(rest&&!rest.fin){rest.end+=+t.dataset.d*1000;rest.total=Math.max(rest.total,rest.end-Date.now());tick()}},
  rskip:hideRest,
  hv:t=>{hv=t.dataset.v;render()},
  progsel:()=>{},
  delsess:t=>{if(confirm('¿Borrar esta sesión del historial?')){S.sessions=S.sessions.filter(s=>s.id!==t.dataset.id);save();render()}},
  rutpick:t=>{rutDay=t.dataset.id;render()},
  editex:t=>{const day=dayById(rutDay),bi=+t.dataset.b,k=+t.dataset.e;edit={bi,k,isNew:false};openSheet(sheetForm(day.blocks[bi][k],false))},
  addblk:()=>{edit={bi:-1,k:-1,isNew:true};openSheet(sheetForm({name:'',sets:3,min:10,max:12,unit:'r',note:''},true))},
  addss:t=>{edit={bi:+t.dataset.b,k:-1,isNew:true};openSheet(sheetForm({name:'',sets:3,min:10,max:12,unit:'r',note:''},true))},
  closesheet:closeSheet,

    const day=dayById(rutDay),v=readSheet();

    save();closeSheet();render();
  },
  blkup:t=>{const b=S.routine.days.find(d=>d.id===rutDay).blocks,i=+t.dataset.b;if(i>0){[b[i-1],b[i]]=[b[i],b[i-1]];save();render()}},
  blkdn:t=>{const b=S.routine.days.find(d=>d.id===rutDay).blocks,i=+t.dataset.b;if(i<b.length-1){[b[i+1],b[i]]=[b[i],b[i+1]];save();render()}},
  resetrut:()=>{if(confirm('¿Restaurar la rutina original? El historial se conserva.')){S.routine=seed();save();render()}},
  expjson:()=>download(`gym-respaldo-${stamp()}.json`,JSON.stringify(S,null,1),'application/json'),
  expcsv:()=>download(`gym-historial-${stamp()}.csv`,'﻿'+toCSV(),'text/csv'),
  imp:()=>$('#file').click()
};
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-act]');
  if(t){(A[t.dataset.act]||(()=>{}))(t,ev);return}
  const n=ev.target.closest('nav button');
  if(n){tab=n.dataset.tab;scrollTo(0,0);render()}
  if(ev.target.id==='sheetBg')closeSheet();
});
document.addEventListener('change',ev=>{if(ev.target.dataset.act==='progsel'){progEx=ev.target.value;render()}});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.classList.contains('num')){const s=sessSet(t.dataset.ex,+t.dataset.i);if(s){s[t.dataset.f]=num(t.value);save()}}
});
document.addEventListener('focusin',ev=>{if(ev.target.classList&&ev.target.classList.contains('num'))setTimeout(()=>ev.target.select(),0)});

function render(){
  const y=scrollY;
  $('#app').innerHTML=({train:vTrain,hist:vHist,rut:vRut,info:vInfo})[tab]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  scrollTo(0,y);
}
render();
if(S.active){wakeLock();toast('Retomando tu entrenamiento en curso')}
</script>
</body>
</html>
